# Production SPA (light shell + journey) at root.
# VeriLock Railway service builds via Dockerfile (RAILWAY_DOCKERFILE_PATH=Dockerfile).
# This file’s deploy healthcheck/startCommand apply; builder is Docker in service config.
# Blog lives on clevertech-os/content-studio (service name: blog) — separate packaging.

[build]
builder = "nixpacks"
buildCommand = "npm install && npm install --prefix server && npm install --prefix client && npm run build --prefix client"

[deploy]
# Uses Dockerfile CMD (WORKDIR /app/server)
startCommand = "node --import tsx src/index.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
